name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  existing-trial-sql:
    name: Existing-user trial SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: trial-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: trial-test-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated trial schema
        run: psql -X -v ON_ERROR_STOP=1 -f apps/api/tests/sql/existing_trial_bootstrap.sql
      - name: Apply only new trial migration
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/0032_existing_user_trial_claim.sql
      - name: Exercise owner eligibility, claim, and boundaries
        run: psql -X -v ON_ERROR_STOP=1 -f apps/api/tests/sql/existing_trial_rehearsal.sql
      - name: Exercise concurrent claims across two Free workspaces
        run: sh apps/api/tests/sql/existing_trial_concurrency.sh
      - name: Verify service-only RPC grants
        run: |
          test "$(psql -X -A -t -c "select has_function_privilege('authenticated','public.claim_existing_user_trial(uuid,uuid)','EXECUTE')::text || ',' || has_function_privilege('service_role','public.claim_existing_user_trial(uuid,uuid)','EXECUTE')::text")" = "false,true"

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install API dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run API test suite
        run: python -m pytest -q

  web-checks:
    name: Web typecheck, build, and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck web app
        run: npm run typecheck

      - name: Build web app
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run desktop, mobile, and tablet smoke tests
        env:
          CI: "1"
          E2E_START_SERVER: "1"
        run: npm run test:e2e -- --workers=1
