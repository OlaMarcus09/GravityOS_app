<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05060d" />
    <title>Gravity OS — Offline</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: radial-gradient(circle at top, #17192b, #05060d 58%);
        color: #f6f7fb;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { max-width: 28rem; text-align: center; }
      img { width: 4rem; height: 4rem; margin-bottom: 1.25rem; }
      h1 { margin: 0 0 0.75rem; font-size: 1.75rem; }
      p { margin: 0 0 1.5rem; color: #b8bdd1; line-height: 1.6; }
      button {
        border: 1px solid #f5a524;
        border-radius: 0.75rem;
        padding: 0.75rem 1rem;
        background: #f5a524;
        color: #05060d;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>You’re offline</h1>
      <p>Gravity OS needs a connection to load your latest workspace data. Reconnect, then try again.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
