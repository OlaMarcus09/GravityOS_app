# Gravity OS — Render blueprint (ARCHITECTURE.md sections 1 & 4)
# Hosts the FastAPI service as a Docker web service. The Next.js frontend
# deploys to Vercel separately.
services:
  - type: web
    name: gravity-os-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    plan: starter
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_JWT_AUD
        value: authenticated
      - key: CORS_ORIGINS
        sync: false
      - key: WEB_APP_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SUPER_ADMIN_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Gravity OS <notifications@gravityos.tech>
      - key: EMAIL_REPLY_TO
        sync: false

  - type: cron
    name: gravity-os-notifications
    runtime: docker
    schedule: "*/5 * * * *"
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    dockerCommand: python -m app.jobs.notifications
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Gravity OS <notifications@gravityos.tech>
      - key: EMAIL_REPLY_TO
        sync: false
      - key: WEB_APP_URL
        value: https://www.gravityos.tech
      - key: ENVIRONMENT
        value: production
